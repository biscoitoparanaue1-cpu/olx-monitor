name: Scraper diário

on:
  schedule:
    # 07:00, 10:00 e 13:00 em Brasília. A OLX às vezes bloqueia o IP do GitHub;
    # as tentativas seguintes só rodam o que ainda não deu certo no dia.
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Testes
        run: python -m pytest -q

      - name: Rodar scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLX_PROXY: ${{ secrets.OLX_PROXY }}   # opcional
          OLX_DEBUG_DIR: debug
        run: python -m app.jobs.daily --skip-if-done-today

      # Amostras de HTML (busca, anúncio, bloqueio) para diagnosticar mudanças na OLX
      - name: Guardar amostras de HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
