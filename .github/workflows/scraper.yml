name: Scraper diário

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Testes
        run: python -m pytest -q

      - name: Rodar scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLX_DEBUG_DIR: debug
        run: python -m app.jobs.daily

      # Amostras de HTML (busca, anúncio, bloqueio) para diagnosticar mudanças na OLX
      - name: Guardar amostras de HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
