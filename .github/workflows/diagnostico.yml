name: Diagnóstico da OLX

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt playwright playwright-stealth
          python -m playwright install --with-deps chromium
      - run: python -m app.scraper.diagnose "TV LG OLED"
